<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Work out the minimum net profit, trading days, and daily target needed for a maximum payout on a MyFundedFutures 50k Builder account."
    />
    <title>Max Payout Calculator</title>

    <!-- Link previews in chat apps. Set VITE_SITE_URL in .env so the image
         URL is absolute; many apps ignore a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Max Payout Calculator" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Max Payout Calculator" />
    <meta
      property="og:description"
      content="How many trading days, and how much each day, to reach a max payout on a MyFundedFutures 50k Builder account."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Max payout calculator: How many days to your max payout? Above a chart of daily profit and planned days under a daily cap."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
