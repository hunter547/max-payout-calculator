<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 914 473">
<!-- Lucid Trading lockup, rebuilt as vector art. The sphere is drawn from
     gradients fitted to the firm's own 400px dark-mode render: a flare where
     the light catches the upper-left rim, a bloom outside it, a rim line that
     fades away from the light, and a weaker catch at the lower right. The
     wordmark is traced from their 600px social card, and the framing follows
     the bitmap this replaces. -->
